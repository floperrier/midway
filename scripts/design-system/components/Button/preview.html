<!-- @dsCard group="Actions" height=136 subtitle="Default for the one action, outline beside it, ghost for rows and Cancel" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Button</title></head>
<body>
<div id="root" class="grid gap-4 p-6"></div>
<script>
  var M = window.Midway, h = React.createElement, I = M.icons;
  function icon(C) { return h(C, { className: "size-4", "aria-hidden": true }); }
  ReactDOM.createRoot(document.getElementById("root")).render(
    h(React.Fragment, null,
      h("div", { className: "flex flex-wrap items-center gap-3" },
        h(M.Button, null, icon(I.Plus), "New campaign"),
        h(M.Button, { variant: "outline" }, "Delete campaign"),
        h(M.Button, { variant: "ghost" }, "Cancel"),
        h(M.Button, { disabled: true }, "Saving…")
      ),
      h("div", { className: "flex flex-wrap items-center gap-2" },
        h(M.Button, { variant: "outline", size: "sm" }, icon(I.Copy), "Copy"),
        h(M.Button, { variant: "outline", size: "sm" }, "Open"),
        h(M.Button, { variant: "outline", size: "sm" }, icon(I.Download), "Export CSV"),
        h(M.Button, { variant: "ghost", size: "icon" }, icon(I.Pencil), h("span", { className: "sr-only" }, "Edit Quillfen Tea")),
        h(M.Button, { variant: "ghost", size: "icon" }, icon(I.Trash2), h("span", { className: "sr-only" }, "Remove prize 2"))
      )
    )
  );
</script>
</body>
</html>
